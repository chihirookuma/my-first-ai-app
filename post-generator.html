<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投稿ネタ生成ツール | Instagram & Threads</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a3a6b 0%, #2563eb 50%, #0ea5e9 100%);
      font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      color: #ffffff;
      padding: 24px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.95rem;
      font-weight: 300;
      opacity: 0.85;
      letter-spacing: 0.08em;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: rgba(255, 255, 255, 0.6);
      margin: 16px auto 0;
      border-radius: 2px;
    }

    .input-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 24px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      font-family: inherit;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 16px;
    }

    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    input[type="text"]:focus {
      border-color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.2);
    }

    .generate-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #1a3a6b;
      background: #ffffff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .generate-btn:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    .generate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .post {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 18px 18px 14px;
      backdrop-filter: blur(8px);
      animation: fadeIn 0.4s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .post-number {
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0.7;
      letter-spacing: 0.1em;
    }

    .copy-btn {
      font-size: 0.8rem;
      padding: 6px 12px;
      color: #1a3a6b;
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }

    .copy-btn:active {
      transform: scale(0.95);
    }

    .copy-btn.copied {
      background: #34d399;
      color: #ffffff;
    }

    .post-body {
      font-size: 0.98rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      opacity: 0.7;
      font-size: 0.9rem;
      padding: 24px 0;
    }

    @media (max-width: 480px) {
      .title { font-size: 1.5rem; }
      .input-card { padding: 20px; }
      .post { padding: 16px 14px 12px; }
      .post-body { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">投稿ネタ生成ツール</div>
      <div class="subtitle">Instagram & Threads</div>
      <div class="divider"></div>
    </div>

    <div class="input-card">
      <label for="topic">テーマ・キーワードを入力</label>
      <input type="text" id="topic" placeholder="例：朝活、カフェ巡り、副業、子育て…" autocomplete="off">
      <button class="generate-btn" id="generateBtn">10個のネタを生成する</button>
    </div>

    <div class="results" id="results">
      <div class="empty">↑ テーマを入力して、ボタンを押してください</div>
    </div>
  </div>

  <script>
    // ============================================================
    // ★ ここにあなたのCloudflare WorkerのURLを貼り付けてください
    // 例: "https://post-generator-api.your-name.workers.dev"
    // ============================================================
    const API_URL = "";

    const topicInput = document.getElementById('topic');
    const generateBtn = document.getElementById('generateBtn');
    const results = document.getElementById('results');

    async function generate() {
      const topic = topicInput.value.trim();
      if (!topic) {
        topicInput.focus();
        results.innerHTML = '<div class="empty">テーマを入力してください</div>';
        return;
      }

      if (!API_URL) {
        results.innerHTML = '<div class="empty">⚠️ API_URL が設定されていません。<br>worker/README.md を参考に設定してください。</div>';
        return;
      }

      generateBtn.disabled = true;
      generateBtn.textContent = 'AIが考え中…（10〜20秒）';
      results.innerHTML = '<div class="empty">✨ AIが10個の投稿文を考えています…</div>';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic }),
        });

        const data = await res.json();

        if (!res.ok) {
          results.innerHTML = `<div class="empty">エラー: ${escapeHtml(data.error || '不明なエラー')}</div>`;
          return;
        }

        renderPosts(data.posts || []);
      } catch (err) {
        results.innerHTML = '<div class="empty">通信エラーが発生しました。しばらくしてからお試しください。</div>';
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = '10個のネタを生成する';
      }
    }

    function renderPosts(posts) {
      results.innerHTML = '';
      if (posts.length === 0) {
        results.innerHTML = '<div class="empty">投稿文が取得できませんでした。</div>';
        return;
      }
      posts.forEach((text, i) => {
        const post = document.createElement('div');
        post.className = 'post';
        post.style.animationDelay = (i * 0.05) + 's';
        post.innerHTML = `
          <div class="post-header">
            <span class="post-number">No. ${String(i + 1).padStart(2, '0')}</span>
            <button class="copy-btn" type="button">コピー</button>
          </div>
          <div class="post-body"></div>
        `;
        post.querySelector('.post-body').textContent = text;

        const copyBtn = post.querySelector('.copy-btn');
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(text);
            copyBtn.textContent = 'コピー済み✓';
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.textContent = 'コピー';
              copyBtn.classList.remove('copied');
            }, 1500);
          } catch (e) {
            copyBtn.textContent = 'コピー失敗';
          }
        });

        results.appendChild(post);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    generateBtn.addEventListener('click', generate);
    topicInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') generate();
    });
  </script>
</body>
</html>
