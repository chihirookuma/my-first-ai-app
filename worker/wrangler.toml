name = "post-generator-api"
main = "src/worker.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# 1分間に1つのIPアドレスからのリクエストを5回までに制限します
# 悪用や予期しない高額請求を防ぐための重要な設定です
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
