<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>ちーちゃんコンペ ロゴ案</title>
<style>
body{margin:0;background:#f4f1ea;font-family:"Hiragino Sans","IPAGothic",sans-serif;color:#1f3a2e}
h1{font-size:22px;text-align:center;margin:28px 0 4px}
p.sub{text-align:center;margin:0 0 20px;color:#5b6b62;font-size:13px}
.grid{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;padding:0 20px 30px}
.card{background:#fff;border-radius:14px;width:300px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h2{font-size:15px;margin:12px 0 4px}.card p{font-size:12px;line-height:1.6;margin:0;color:#4a574f}
.dark{background:#1f4d3a;border-radius:10px;margin-top:10px;display:flex;justify-content:center;padding:10px}
</style></head><body>
<h1>ちーちゃんコンペ ロゴ案</h1>
<p class="sub">色：深緑 #1F4D3A ／ ゴールド #C9A24B ／ クリーム #F4F1EA</p>
<div class="grid">

<!-- A: エンブレム -->
<div class="card">
<svg viewBox="0 0 300 300" width="264" height="264">
 <defs><path id="arcTop" d="M48,150 A102,102 0 0 1 252,150"/><path id="arcBot" d="M52,150 A98,98 0 0 0 248,150"/></defs>
 <circle cx="150" cy="150" r="138" fill="#1f4d3a"/>
 <circle cx="150" cy="150" r="128" fill="none" stroke="#c9a24b" stroke-width="2"/>
 <circle cx="150" cy="150" r="70" fill="#f4f1ea"/>
 <text font-family="Georgia,'DejaVu Serif',serif" font-size="18" letter-spacing="3" fill="#c9a24b" font-weight="bold"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">CHII-CHAN COMPE</textPath></text>
 <text font-family="Georgia,'DejaVu Serif',serif" font-size="14" letter-spacing="5" fill="#c9a24b"><textPath href="#arcBot" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">GOLF · FRIENDS · TRUST</textPath></text>
 
 <!-- green & flag -->
 <ellipse cx="150" cy="185" rx="48" ry="11" fill="#1f4d3a"/>
 <line x1="150" y1="183" x2="150" y2="108" stroke="#1f4d3a" stroke-width="4" stroke-linecap="round"/>
 <path d="M152,108 L188,120 L152,132 Z" fill="#c9a24b"/>
 <circle cx="128" cy="180" r="6" fill="#fff" stroke="#1f4d3a" stroke-width="1.5"/>
 <text x="150" y="207" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1f4d3a" letter-spacing="2">EST. 2027</text>
</svg>
<h2>A. エンブレム型（倶楽部らしさ）</h2>
<p>名門クラブのような円形バッジ。経営者層にも違和感がなく、ゴルフウェアの刺しゅうやキャップ、マーカーにも向く。</p>
</div>

<!-- B: ち＋ボール -->
<div class="card">
<svg viewBox="0 0 300 300" width="264" height="264">
 <rect width="300" height="300" rx="30" fill="#f4f1ea"/>
 <!-- ち の形: 横線 + 縦線 + 丸 -->
 <path d="M92,92 L178,80" stroke="#1f4d3a" stroke-width="18" stroke-linecap="round" fill="none"/>
 <path d="M140,56 L118,150" stroke="#1f4d3a" stroke-width="18" stroke-linecap="round" fill="none"/>
 <path d="M118,150 C150,118 214,124 214,176 C214,226 160,240 118,224" stroke="#1f4d3a" stroke-width="18" stroke-linecap="round" fill="none"/>
 <!-- golf ball inside -->
 <circle cx="166" cy="178" r="26" fill="#fff" stroke="#c9a24b" stroke-width="3"/>
 <g fill="#d9cfb4"><circle cx="156" cy="170" r="3"/><circle cx="168" cy="166" r="3"/><circle cx="178" cy="174" r="3"/><circle cx="160" cy="182" r="3"/><circle cx="172" cy="186" r="3"/><circle cx="182" cy="188" r="2.5"/><circle cx="152" cy="190" r="2.5"/></g>
 <!-- flag -->
 <line x1="226" y1="60" x2="226" y2="126" stroke="#c9a24b" stroke-width="4" stroke-linecap="round"/>
 <path d="M228,60 L256,70 L228,80 Z" fill="#c9a24b"/>
 <text x="150" y="276" text-anchor="middle" font-family="IPAPGothic,IPAGothic,sans-serif" font-size="24" font-weight="bold" fill="#1f4d3a" letter-spacing="3">ちーちゃんコンペ</text>
</svg>
<h2>B. 「ち」＋ゴルフボール（親しみ）</h2>
<p>頭文字「ち」の丸い部分にボールを入れたマーク。名前の親しみやすさが伝わり、LINEのアイコンやスタンプ風にも使いやすい。</p>
</div>

<!-- C: ワードマーク -->
<div class="card">
<svg viewBox="0 0 300 300" width="264" height="264">
 <rect width="300" height="300" rx="30" fill="#fff"/>
 <text x="38" y="160" font-family="Georgia,'DejaVu Serif',serif" font-size="74" font-weight="bold" fill="#1f4d3a">ch</text>
 <!-- i 1: flag pin -->
 <line x1="170" y1="160" x2="170" y2="92" stroke="#1f4d3a" stroke-width="11" stroke-linecap="round"/>
 <path d="M174,92 L196,99 L174,106 Z" fill="#c9a24b"/>
 <!-- i 2: tee + ball -->
 <path d="M212,160 L212,130 M201,128 L223,128" stroke="#1f4d3a" stroke-width="11" stroke-linecap="round"/>
 <circle cx="212" cy="111" r="12" fill="#fff" stroke="#c9a24b" stroke-width="4"/>
 <line x1="40" y1="186" x2="260" y2="186" stroke="#c9a24b" stroke-width="2"/>
 <text x="150" y="220" text-anchor="middle" font-family="IPAPGothic,IPAGothic,sans-serif" font-size="20" fill="#1f4d3a" letter-spacing="6">ちーちゃんコンペ</text>
 <text x="150" y="246" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#7a8a80" letter-spacing="4">GOLF &amp; TALK</text>
</svg>
<h2>C. ワードマーク型（すっきり）</h2>
<p>「chii」の2つの i をピンフラッグとティー＋ボールに。文字だけでも成立し、名刺やLINEのノート見出しに使いやすい。</p>
</div>

</div></body></html>
